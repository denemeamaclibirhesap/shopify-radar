name: scan

on:
  schedule:
    - cron: "17 3 * * *"   # her gün 03:17 UTC
    - cron: "17 15 * * *"  # her gün 15:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # private depoda ayda 2.000 dakika ücretsiz: 2 x 30 x 30 = 1.800
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tara ve rapor üret
        timeout-minutes: 26   # süre dolsa bile sonraki adım çalışır ve o ana kadarki sonuçlar kaydedilir
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m radar.cli run
      - name: Veriyi depoya kaydet
        if: always()
        run: |
          python -m radar.cli report || true   # tarama süre yüzünden yarıda kesildiyse de rapor güncellensin
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Tarama sonuçları $(date -u +%F-%H%M)"
          git push
