name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          UA="ShopifyRadar/0.1 (herkese acik veri arastirmasi)"
          probe() { echo "== $1"; curl -sS -m 60 -A "$UA" -o /tmp/o -w "status=%{http_code} size=%{size_download} time=%{time_total}\n" "$1" || echo "curl failed"; head -c ${2:-400} /tmp/o | tr '\n' ' '; echo; }
          probe "https://api.github.com/repos/InternetHealthReport/crux-top-lists-country/contents/data" 600
          probe "https://api.github.com/repos/InternetHealthReport/crux-top-lists-country/contents/data/country" 1500
          probe "https://raw.githubusercontent.com/InternetHealthReport/crux-top-lists-country/main/latest.txt" 200
          probe "https://api.github.com/repos/InternetHealthReport/crux-top-lists-country/contents/data/country/tr" 800
          IDX=CC-MAIN-2026-39
          probe "https://index.commoncrawl.org/$IDX-index?url=com.tr&matchType=domain&page=100&limit=5&output=json&fl=url,languages,status&filter==languages:tur&filter==status:200" 600
          probe "https://index.commoncrawl.org/$IDX-index?url=com.tr&matchType=domain&page=100&output=json&fl=url&filter=~url:.*/(products|collections)/.*&limit=5" 600
