name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          probe() { echo "== $1"; curl -sS -m 60 -A "ShopifyRadar/0.1 (herkese acik veri arastirmasi)" -o /tmp/o -w "status=%{http_code} size=%{size_download} time=%{time_total}\n" "$1" || echo "curl failed"; head -c 500 /tmp/o | tr '\n' ' '; echo; }
          IDX=CC-MAIN-2026-39
          probe "https://index.commoncrawl.org/$IDX-index?url=derimod.com.tr&matchType=domain&limit=3&output=json&fl=url"
          probe "https://index.commoncrawl.org/$IDX-index?url=com.tr&matchType=domain&showNumPages=true&output=json"
          probe "https://index.commoncrawl.org/$IDX-index?url=com.tr&matchType=domain&limit=10&output=json&fl=url&page=0"
          probe "https://index.commoncrawl.org/$IDX-index?url=com.tr&matchType=domain&limit=10&output=json&fl=url&filter=~url:.*/collections/.*"
          probe "https://web.archive.org/cdx/search/cdx?url=com.tr&matchType=domain&limit=5&fl=original&filter=original:.*/collections/.*"
          probe "https://web.archive.org/cdx/search/cdx?url=derimod.com.tr&matchType=domain&limit=3&fl=original"
